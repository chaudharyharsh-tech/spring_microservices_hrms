syntax = "proto3";

package salary.events;
option java_multiple_files = true;

message SalaryEvent {
  string employeeId = 1;
  int64 salary = 2;
  Date created_date = 3;
  Month salary_month = 4;
}

message Month{
  string month_name = 1;
}

message Date {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}